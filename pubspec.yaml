name: nexus_flag_movil
description: "Aplicación para gestionar torneos de flag football"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UX
  flutter_native_splash: ^2.4.7

  # Navegación
  go_router: ^15.1.3

  # Gestión de estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^7.2.0

  # Modelos inmutables
  freezed_annotation: ^3.0.0

  # Red (API REST)
  dio: ^5.8.0+1
  intl: ^0.20.2
  json_annotation: 4.9.0
  retrofit: 4.4.2

  equatable: ^2.0.8
  fpdart: ^1.2.0

  # Persistencia local
  shared_preferences: ^2.5.4
  objectbox: ^4.3.0
  objectbox_flutter_libs: any
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Motor de lints genéricos
  custom_lint: 0.7.5

  # Code generation
  build_runner: 2.4.15
  freezed: 3.0.6
  json_serializable: 6.9.5
  retrofit_generator: 9.2.0
  riverpod_generator: 2.6.5
  riverpod_lint: 2.6.5
  objectbox_generator: any

flutter:
  uses-material-design: true

  # Fuentes
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 700

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  # Assets
  assets:
    - assets/iconos/
    - assets/imagenes/
    - assets/imagenes/logo/

# Configuración de Flutter Native Splash
flutter_native_splash:
  image: assets/imagenes/logo/nexus_flag_logo_nombre.png
  color: "#000000"
  android: true
  android_12:
    image: assets/imagenes/logo/nexus_flag_logo_nombre.png
    color: "#000000"
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center
  fullscreen: true